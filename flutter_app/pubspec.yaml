name: multi_domain_ai
description: "Multi-Domain AI Assistance — Smart solutions across domains, all in one place."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.6.3

  # State Management
  flutter_riverpod: ^2.6.1

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.3

  # UI Components
  flutter_svg: ^2.0.10+1
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.3
  pin_code_fields: ^8.0.1
  # Note: Using Flutter's native Switch widget for toggles
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1

  # Sound & Haptics
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.3

  # HTTP (kept for backend integration)
  http: ^1.2.2
  http_parser: ^4.0.2
  mime: ^2.0.0
  path: ^1.9.1
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  permission_handler: ^12.0.3
  google_generative_ai: ^0.4.7
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# App Icon configuration (generates for iOS + Android from single source)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#050B18"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/lottie/
